name: morning_pipeline
on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 15 * * *"   # 10:00 America/Lima (UTC-5)

concurrency:
  group: morning_pipeline
  cancel-in-progress: true

jobs:
  run:
    runs-on: self-hosted
    timeout-minutes: 60
    defaults: { run: { shell: powershell } }
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGDATABASE: mcd
      PGUSER: mcd_loader
      PGPASSWORD: ${{ secrets.LOADER_PASSWORD }}
      DBT_PASSWORD: ${{ secrets.DBT_PASSWORD }}
      # Optional PBI secrets mapped to env if you use the refresh step:
      PBI_TENANT_ID:     ${{ secrets.AZURE_TENANT_ID }}
      PBI_CLIENT_ID:     ${{ secrets.AZURE_CLIENT_ID }}
      PBI_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      PBI_GROUP_ID:      ${{ secrets.PBI_GROUP_ID }}
      PBI_DATASET_ID:    ${{ secrets.PBI_DATASET_ID }}


    steps:
      - uses: actions/checkout@v4

      - name: Show Python
        run: |
          python --version
          python -c "import sys; print(sys.executable)"

      - name: Install deps (system Python)
        run: |
          python -m pip install --upgrade pip setuptools wheel
          if (Test-Path "elt/requirements.txt") { pip install -r elt/requirements.txt } else { pip install psycopg2-binary }
          pip install dbt-postgres

      - name: Ingest (Drive → Postgres raw)
        run: python elt/ingest.py

      - name: dbt debug (show config)
        run: |
          cd dbt/building_admin
          $env:DBT_PROFILES_DIR="$env:USERPROFILE\.dbt"
          dbt --version
          dbt debug --config-dir
          dbt debug --target dev

      - name: dbt run
        run: |
          cd dbt/building_admin
          $env:DBT_PROFILES_DIR="$env:USERPROFILE\.dbt"
          dbt run --no-use-colors --debug

      - name: dbt test (non-blocking while we verify)
        run: |
          cd dbt/building_admin
          $env:DBT_PROFILES_DIR="$env:USERPROFILE\.dbt"
          dbt test --no-use-colors --debug
        continue-on-error: true

      - name: Upload dbt artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dbt-artifacts
          path: |
            dbt/building_admin/target/**
            dbt/building_admin/logs/**
          retention-days: 3


      - name: Power BI refresh
        if: ${{ env.PBI_DATASET_ID != '' }}
        run: |
          $Tenant  = "$env:PBI_TENANT_ID"
          $Client  = "$env:PBI_CLIENT_ID"
          $Secret  = "$env:PBI_CLIENT_SECRET"
          $Group   = "$env:PBI_GROUP_ID"
          $Dataset = "$env:PBI_DATASET_ID"

          $body = @{ client_id=$Client; client_secret=$Secret; grant_type="client_credentials"; scope="https://analysis.windows.net/powerbi/api/.default" }
          $token = (Invoke-RestMethod -Method Post -Uri "https://login.microsoftonline.com/$Tenant/oauth2/v2.0/token" -Body $body).access_token
          Invoke-RestMethod -Method Post -Headers @{ Authorization="Bearer $token" } `
            -Uri "https://api.powerbi.com/v1.0/myorg/groups/$Group/datasets/$Dataset/refreshes" `
            -Body '{"notifyOption":"MailOnFailure"}' -ContentType "application/json"
