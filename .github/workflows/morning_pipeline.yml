name: morning_pipeline
on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 12 * * *"   # 12:00 UTC = 07:00 America/Lima

env:
  PGHOST: localhost
  PGPORT: 5432
  PGDATABASE: mcd
  PGUSER: mcd_loader
  PGPASSWORD: ${{ secrets.LOADER_PASSWORD }}   # loader user (for ingest.py)
  DBT_PASSWORD: ${{ secrets.DBT_PASSWORD }}    # dbt user (profiles.yml)

jobs:
  run:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Upgrade pip & install deps
        shell: pwsh
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r elt/requirements.txt
          pip install dbt-postgres

      - name: Ingest (Python)
        shell: pwsh
        run: python elt/ingest.py

      - name: dbt run + test
        shell: pwsh
        run: |
          cd dbt/building_admin
          dbt deps || $true
          dbt run
          dbt test