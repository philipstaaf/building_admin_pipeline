name: nightly-pipeline
on:
  workflow_dispatch: {}              # manual "Run workflow" button
  schedule:
    - cron: "0 8 * * *"              # 08:00 UTC ≈ 03:00 America/Lima

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          pip install -r elt/requirements.txt || true
          pip install dbt-postgres || true

      - name: Python ingest (placeholder)
        run: python elt/ingest.py
        continue-on-error: true
        env:
          DB_URL: ${{ secrets.DB_URL }}
          GMAIL_TOKEN: ${{ secrets.GMAIL_TOKEN }}
          SHEETS_CREDENTIALS_JSON: ${{ secrets.SHEETS_CREDENTIALS_JSON }}

      - name: dbt run + test
        run: |
          cd dbt/building_admin
          dbt deps || true
          dbt run  || true
          dbt test || true
        env:
          DBT_PASSWORD: ${{ secrets.DBT_PASSWORD }}
          # add DBT_HOST/USER/DBNAME/SCHEMA here later if your profiles.yml uses env vars

      - name: Power BI refresh (placeholder)
        run: python ops/powerbi_refresh.py
        continue-on-error: true
        env:
          AZURE_TENANT_ID:     ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID:     ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          PBI_GROUP_ID:        ${{ secrets.PBI_GROUP_ID }}
          PBI_DATASET_ID:      ${{ secrets.PBI_DATASET_ID }}
